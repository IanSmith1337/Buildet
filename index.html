<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<link
			rel="stylesheet"
			href="css/styles.css" />
		<title>Buildet</title>
		<script
			type="module"
			src="./js/setup.js"></script>
	</head>
	<body>
		<script
			type="module"
			src="./js/renderer.js"></script>
		<div class="position-relative vh-100">
			<nav
				class="position-absolute navbar bg-secondary z-2 ps-3 pt-2 round-bottom-right-corner">
				<div class="container-fluid mx-0 my-0 px-0 py-0">
					<a
						class="navbar-brand pe-3 me-0 pb-2"
						href="#">
						<img
							src="https://placehold.co/300x60"
							alt="Buildet Logo" />
					</a>
				</div>
			</nav>
			<canvas class="editor"></canvas>
			<nav
				class="position-absolute navbar flex-nowrap overflow-x-scroll justify-content-start bg-secondary bottom-0 start-0 gap-3 px-2 py-2 z-2 w-100">
				<button
					class="btn btn-primary"
					data-bs-toggle="modal"
					data-bs-target="#exampleModal">
					Billet Details
				</button>
				<button class="btn btn-primary">Draw/Upset</button>
				<button class="btn btn-primary">Cut & Restack/Fold</button>
				<button class="btn btn-primary">Make Cut/Divot</button>
				<button class="btn btn-primary">Twist</button>
				<button class="btn btn-primary">Grind</button>
			</nav>
			<!-- Modal -->
			<div
				class="modal fade"
				id="exampleModal"
				tabindex="-1"
				aria-labelledby="exampleModalLabel"
				aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h1
								class="modal-title fs-5"
								id="exampleModalLabel">
								Billet Details
							</h1>
							<button
								type="button"
								class="btn-close"
								data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<label for="layer">Layer Count:</label>
							<input
								type="number"
								id="layer"
								name="layer"
								min="1"
								max="100"
								value="1" />
						</div>
						<div class="modal-footer">
							<button
								type="button"
								class="btn btn-primary"
								onclick="updateBillet($('#layer').val())"
								data-bs-dismiss="modal">
								Save changes
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
