<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<link
			rel="stylesheet"
			href="css/styles.css" />
		<title>Buildet</title>
		<script
			type="module"
			src="./js/setup.js"></script>
	</head>
	<body>
		<script
			type="module"
			src="./js/renderer.js"></script>
		<div class="position-relative vh-100">
			<nav
				class="position-absolute navbar bg-secondary z-2 ps-3 pt-2 round-bottom-right-corner">
				<div class="container-fluid mx-0 my-0 px-0 py-0">
					<a
						class="navbar-brand pe-3 me-0 pb-2"
						href="#">
						<img
							src="https://placehold.co/300x60"
							alt="Buildet Logo" />
					</a>
				</div>
			</nav>
			<canvas class="editor"></canvas>
			<nav
				class="position-absolute navbar flex-nowrap overflow-x-scroll justify-content-start bg-secondary bottom-0 start-0 gap-3 px-2 py-2 z-2 w-100">
				<button
					class="btn btn-primary"
					data-bs-toggle="modal"
					data-bs-target="#billetModal">
					Billet Details
				</button>
				<button
					class="btn btn-primary"
					data-bs-toggle="modal"
					data-bs-target="#scaleModal">
					Draw/Upset
				</button>
				<button
					class="btn btn-primary"
					onclick="makeCut()">
					Make Cut/Divot
				</button>
			</nav>
			<div
				class="modal fade"
				id="billetModal"
				tabindex="-1"
				aria-labelledby="billetModalLabel"
				aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h1
								class="modal-title fs-5"
								id="billetModalLabel">
								Billet Details
							</h1>
							<button
								type="button"
								class="btn-close"
								data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<label for="layer">Layer Count:</label>
							<input
								type="number"
								id="layer"
								name="layer"
								min="1"
								max="100"
								value="1" />
						</div>
						<div class="modal-footer">
							<button
								type="button"
								class="btn btn-primary"
								onclick="updateBillet($('#layer').val())"
								data-bs-dismiss="modal">
								Apply
							</button>
						</div>
					</div>
				</div>
			</div>
			<div
				class="modal fade"
				id="scaleModal"
				tabindex="-1"
				aria-labelledby="scaleModalLabel"
				aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h1
								class="modal-title fs-5"
								id="scaleModalLabel">
								Draw/Upset
							</h1>
							<button
								type="button"
								class="btn-close"
								data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<label for="direction">Target Axis:</label>
							<div id="direction">
								<div class="form-check">
									<input
										class="form-check-input"
										type="radio"
										name="direction"
										id="x"
										value="x" />
									<label
										class="form-check-label"
										for="x"
										checked>
										X
									</label>
								</div>
								<div class="form-check">
									<input
										class="form-check-input"
										type="radio"
										name="direction"
										id="y"
										value="y" />
									<label
										class="form-check-label"
										for="y">
										Y
									</label>
								</div>
								<div class="form-check">
									<input
										class="form-check-input"
										type="radio"
										name="direction"
										id="z"
										value="z" />
									<label
										class="form-check-label"
										for="z">
										Z
									</label>
								</div>
							</div>
							<label for="scale">Scale:</label>
							<input
								type="number"
								id="scale"
								name="scale"
								min="1"
								max="100"
								value="1" />
						</div>
						<div class="modal-footer">
							<button
								type="button"
								class="btn btn-primary"
								onclick="
									drawupset(
										$('input[name=\'direction\']:checked').val(),
										$('#scale').val(),
									)
								"
								data-bs-dismiss="modal">
								Apply
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
